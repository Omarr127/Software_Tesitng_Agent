<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Search</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 50px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
    }

    input {
      width: 75%;
      padding: 10px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }

    #results {
      margin-top: 30px;
    }

    .product {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Search Products</h1>

  <input
    type="text"
    id="search"
    placeholder="Search for a product"
  >

  <button id="search-button">
    Search
  </button>

  <div id="results"></div>

</div>

<script>
  const products = [
    "Laptop",
    "Phone",
    "Headphones",
    "Keyboard",
    "Mouse"
  ];

  document
    .getElementById("search-button")
    .addEventListener("click", function() {

      const searchValue =
        document
          .getElementById("search")
          .value
          .toLowerCase();

      const results =
        document.getElementById("results");

      results.innerHTML = "";

      const matches =
        products.filter(product =>
          product.toLowerCase().includes(searchValue)
        );

      if (matches.length === 0) {
        results.innerHTML =
          "<p>No products found</p>";
        return;
      }

      matches.forEach(product => {
        const div =
          document.createElement("div");

        div.className =
          "product";

        div.textContent =
          product;

        results.appendChild(div);
      });
    });
</script>

</body>
</html>
